<!doctype html>
<html lang="en">
  <head>
    <title>Eixut</title>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sixtyfour&display=swap"
      rel="stylesheet"
    />
    <link rel="manifest" href="./manifest.json" />
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <div id="game-container">
      <div id="uiContainer">
        <div id="killsDisplay">KILLS: 0</div>
        <div id="shotgunDisplay"></div>
        <div id="cooldownContainer">
          <div id="cooldownBar"></div>
        </div>
        <div id="healthDisplay">HEALTH: ❤️❤️❤️</div>
      </div>
      <div id="debugOverlay" style="display:none"></div>
      <div id="debugLog" style="position:absolute;top:220px;left:6px;z-index:100;pointer-events:none;font-family:monospace;font-size:11px;color:#f80;text-shadow:1px 1px 2px #000;line-height:1.5;"></div>

      <div id="transitionOverlay"></div>
      <div id="gameOverOverlay" class="overlay">GAME OVER</div>
      <div id="startModal" class="overlay">
        <h1>EIXUT</h1>
        <p id="hell">Explore hell</p>
        <ul>
          <li>
            <span class="key">SWIPE</span>
            <span class="action">to move and dodge</span>
          </li>
          <li>
            <span class="key">HOLD + SWIPE</span>
            <span class="action">to attack</span>
          </li>
          <li>
            <span class="key">LONG HOLD + SWIPE</span>
            <span class="action">to hard attack</span>
          </li>
          <li>
            <span class="key">TAP</span> <span class="action">to shield</span>
          </li>
          <hr />
          <br />
          <li>Best played on mobile (portrait)</li>
        </ul>
        <p class="start-text">( TAP TO START )</p>
      </div>
    </div>

    <script src="./libs/three.min.js"></script>
    <script type="importmap">
      {
        "imports": {}
      }
    </script>
    <script type="module" src="./js/main.js"></script>

    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("./sw.js").then(
            function (registration) {
              console.log(
                "ServiceWorker registration successful with scope: ",
                registration.scope,
              );
            },
            function (err) {
              console.log("ServiceWorker registration failed: ", err);
            },
          );
        });
      } else {
        console.info("Service workers not available on this device");
      }
    </script>
  </body>
</html>
