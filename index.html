<!DOCTYPE html>
<html lang="en">
<head>
    <title>3D Mobile Game Prototype</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sixtyfour&display=swap" rel="stylesheet">
      <link rel="manifest" href="./manifest.json" />
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #111;
            font-family: 'Sixtyfour', sans-serif;
            color: white;
            /* Prevent text selection and touch callouts on mobile */
            -webkit-user-select: none; /* Safari */
            -ms-user-select: none; /* IE 10+ */
            user-select: none; /* Standard syntax */
            touch-action: manipulation; /* Disable double-tap to zoom, etc. */
        }
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            transition: transform 0.05s ease-out;
        }
        canvas {
            display: block;
        }
        #gameOverOverlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            display: none; /* Hidden by default */
            justify-content: center;
            align-items: center;
            font-size: 8vw;
            text-shadow: 3px 3px 6px #ff0000;
            cursor: pointer;
        }
        #uiContainer {
            position: absolute;
            top: 10px;
            left: 10px;
            width: calc(100% - 20px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
            font-size: 3vw;
            text-shadow: 2px 2px 4px #000;
        }
        #healthDisplay {
            color: #ff4444;
        }
         #killsDisplay {
            color: #44aaff;
        }
        #cooldownContainer {
            width: 30vw;
            height: 2vw;
            background-color: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 5px;
            overflow: hidden;
        }
        #cooldownBar {
            width: 100%;
            height: 100%;
            background-color: #00aaff;
            transition: width 0.1s linear;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="uiContainer">
            <div id="killsDisplay">KILLS: 0</div>
            <div id="cooldownContainer">
                <div id="cooldownBar"></div>
            </div>
            <div id="healthDisplay">HEALTH: ❤️❤️❤️</div>
        </div>
        <div id="gameOverOverlay">GAME OVER</div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <script>
        // --- SCENE SETUP ---
        let scene, camera, renderer, player, arenaBounds;
        const clock = new THREE.Clock();

        // --- GAME OBJECTS ---
        let enemies = [];
        let bullets = [];
        let sword, swordPivot, swordTip;
        let attackRangeIndicator;
        let swordTrailParticles = [];
        let swordTrailContainer;
        let explosionParticles = [];
        let explosionContainer;
        let debrisDecals = [];
        let debrisContainer;

        // --- CONSTANTS ---
        const ARENA_WIDTH = 20;
        const ARENA_DEPTH = 20;
        const MAX_ENEMIES = 20;
        const MAX_SPHERE_ENEMIES = 3;
        const PLAYER_SIZE = 0.8;
        const DASH_DISTANCE = 4;
        const DASH_SPEED = 25;
        const ATTACK_DISTANCE = DASH_DISTANCE;
        const ATTACK_SPEED = 33;
        const SWORD_LENGTH = 2.0;
        const SWORD_ARC_DURATION = 0.3;
        const SWORD_ACTIVATION_DISTANCE_RATIO = 0.1;
        const ATTACK_COOLDOWN = 1.0; 
        const ENEMY_SPEED = 1.0;
        const ENEMY_ATTACK_CHARGE_TIME = 0.8; 
        const ENEMY_PRE_FIRE_TIME = 0.15;
        const SPHERE_ENEMY_WANDER_SPEED = 1.5;
        const SPHERE_ENEMY_DASH_SPEED = 18;
        const SPHERE_ENEMY_CHARGE_TIME = 0.6;
        const SPHERE_ENEMY_MIN_ACTION_INTERVAL = 2.0;
        const BULLET_SPEED = 7;
        const BULLET_SIZE = 0.2;
        const HOLD_DURATION_MS = 250;
        const TRAIL_PARTICLE_COUNT = 20;
        const TRAIL_PARTICLE_LIFETIME = 0.25;
        const EXPLOSION_PARTICLE_COUNT = 45; 
        const PARTICLES_PER_EXPLOSION = 15;
        const EXPLOSION_PARTICLE_LIFETIME = 0.8;
        const EXPLOSION_SPEED = 8;
        const PLAYER_INVINCIBILITY_DURATION = 0.2;
        const DEBRIS_COUNT = 30;
        const DEBRIS_LIFETIME = 5.0;
        const SCREEN_SHAKE_DURATION = 0.15;
        const SCREEN_SHAKE_INTENSITY = 8; // In pixels


        // --- GAME STATE ---
        let playerHealth = 3;
        let enemiesKilled = 0;
        let sphereEnemyCount = 0;
        let playerInvincibilityTimer = 0;
        let attackCooldownTimer = 0;
        let screenShakeTimer = 0;
        let cameraOffset = new THREE.Vector3(0, 15, 15);
        let isHolding = false;
        let isDashing = false;
        let isAttacking = false;
        let isGameOver = false;
        let dashStartPosition = new THREE.Vector3();
        let dashDirection = new THREE.Vector3();
        let attackStartPosition = new THREE.Vector3();
        let attackDirection = new THREE.Vector3();
        let swipeStartTime = 0;
        let holdStartTime = 0;
        let swordRotationTimer = 0;
        let nextTrailParticleIndex = 0;
        let nextExplosionParticleIndex = 0;
        let nextDebrisIndex = 0;
        let hitEnemiesInAttack = [];
        let startCoords = null;

        // --- Base Enemy Class ---
        class BaseEnemy {
             constructor(spawnPosition) {
                this.mesh = null;
                this.velocity = new THREE.Vector3();
             }
             update(deltaTime, playerPosition) { /* To be implemented by subclasses */ }
             destroy() {
                createEnemyExplosion(this.mesh.position);
                createDebrisSplat(this.mesh.position);
                scene.remove(this.mesh);
             }
        }

        // --- Cone Enemy Class ---
        class ConeEnemy extends BaseEnemy {
            constructor(spawnPosition) {
                super(spawnPosition);
                this.state = 'spawning'; 
                this.chargeTimer = 0;
                this.waitTimer = 0.5;
                this.targetPosition = new THREE.Vector3();

                const height = PLAYER_SIZE * 1.5;
                const geometry = new THREE.ConeGeometry(PLAYER_SIZE / 2, height, 16);
                this.material = new THREE.MeshStandardMaterial({ color: 0xcccccc });
                this.mesh = new THREE.Mesh(geometry, this.material);
                this.mesh.position.copy(spawnPosition);
                
                const edges = new THREE.EdgesGeometry(geometry);
                this.mesh.add(new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0x000000 })));
                scene.add(this.mesh);
            }

            update(deltaTime, playerPosition) {
                if (isGameOver) {
                    this.velocity.set(0,0,0);
                    return;
                }
               
                switch (this.state) {
                    case 'spawning':
                    case 'recovering':
                        this.material.color.setHex(0xcccccc);
                        this.waitTimer -= deltaTime;
                        if (this.waitTimer <= 0) this.state = 'seeking';
                        break;
                    case 'seeking':
                        this.material.color.setHex(0xcccccc);
                        const distanceToPlayer = this.mesh.position.distanceTo(playerPosition);
                        if (distanceToPlayer <= DASH_DISTANCE) {
                            this.state = 'charging';
                            this.chargeTimer = ENEMY_ATTACK_CHARGE_TIME;
                            this.velocity.set(0, 0, 0);
                            this.targetPosition.copy(playerPosition);
                        } else {
                            const direction = playerPosition.clone().sub(this.mesh.position);
                            direction.y = 0;
                            direction.normalize();
                            this.velocity.copy(direction).multiplyScalar(ENEMY_SPEED);
                        }
                        break;
                    case 'charging':
                        const chargeProgress = 1 - (this.chargeTimer / ENEMY_ATTACK_CHARGE_TIME);
                        this.material.color.lerpColors(new THREE.Color(0xcccccc), new THREE.Color(0xff0000), chargeProgress);
                        this.chargeTimer -= deltaTime;
                        if (this.chargeTimer <= 0) {
                            this.state = 'pre-firing';
                            this.chargeTimer = ENEMY_PRE_FIRE_TIME;
                            this.material.emissive.setHex(0xff0000); // Flash Red
                        }
                        break;
                    case 'pre-firing':
                         this.chargeTimer -= deltaTime;
                         if (this.chargeTimer <= 0) {
                            this.state = 'firing';
                            this.material.emissive.setHex(0x000000);
                         }
                         break;
                    case 'firing':
                        this.fireBullet();
                        this.state = 'recovering';
                        this.waitTimer = 0.5;
                        break;
                }
                this.mesh.position.addScaledVector(this.velocity, deltaTime);
            }

            fireBullet() {
                bullets.push(new Bullet(this.mesh.position, this.targetPosition));
            }
        }
        
        // --- Sphere Enemy Class ---
        class SphereEnemy extends BaseEnemy {
             constructor(spawnPosition) {
                super(spawnPosition);
                this.state = 'wandering'; 
                this.actionTimer = SPHERE_ENEMY_MIN_ACTION_INTERVAL;
                this.wanderDirection = new THREE.Vector3();
                this.dashTarget = new THREE.Vector3();
                this.radius = PLAYER_SIZE / 1.5;

                const geometry = new THREE.SphereGeometry(this.radius, 16, 16);
                this.material = new THREE.MeshStandardMaterial({ color: 0xcccccc });
                this.mesh = new THREE.Mesh(geometry, this.material);
                this.mesh.position.copy(spawnPosition);
                this.mesh.position.y = this.radius;
                
                const edges = new THREE.EdgesGeometry(geometry);
                this.mesh.add(new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0x000000 })));
                scene.add(this.mesh);

                this.setNewWanderDirection();
                sphereEnemyCount++;
            }

            destroy() {
                super.destroy();
                sphereEnemyCount--;
            }

            setNewWanderDirection() {
                 const angle = Math.random() * Math.PI * 2;
                 this.wanderDirection.set(Math.cos(angle), 0, Math.sin(angle));
            }

            update(deltaTime, playerPosition) {
                if (isGameOver) {
                    this.velocity.set(0, 0, 0);
                    return;
                }
                this.actionTimer -= deltaTime;

                switch (this.state) {
                    case 'wandering':
                        if (this.actionTimer <= 0) {
                            this.state = 'charging';
                            this.actionTimer = SPHERE_ENEMY_CHARGE_TIME;
                            this.velocity.set(0, 0, 0);
                            this.dashTarget.copy(playerPosition); // Set target
                        } else {
                            this.velocity.copy(this.wanderDirection).multiplyScalar(SPHERE_ENEMY_WANDER_SPEED);
                        }
                        break;
                    case 'charging':
                        const chargeProgress = 1 - (this.actionTimer / SPHERE_ENEMY_CHARGE_TIME);
                        this.material.color.lerpColors(new THREE.Color(0xcccccc), new THREE.Color(0xff0000), chargeProgress);
                        if (this.actionTimer <= 0) {
                            this.state = 'dashing';
                            const direction = this.dashTarget.clone().sub(this.mesh.position).normalize();
                            this.velocity.copy(direction).multiplyScalar(SPHERE_ENEMY_DASH_SPEED);
                            this.material.color.setHex(0xcccccc);
                        }
                        break;
                    case 'dashing':
                        if (this.mesh.position.distanceTo(playerPosition) < PLAYER_SIZE) {
                             if (playerInvincibilityTimer <= 0) {
                                playerHealth--;
                                playerInvincibilityTimer = PLAYER_INVINCIBILITY_DURATION;
                                player.material.color.setHex(0x555555);
                                createPlayerHitExplosion(player.position);
                                startScreenShake();
                                updateUI();
                                if (playerHealth <= 0) {
                                    gameOver();
                                }
                            }
                        }
                        break;
                }
                 this.mesh.position.addScaledVector(this.velocity, deltaTime);
                 
                 const distanceMoved = this.velocity.length() * deltaTime;
                 if (distanceMoved > 0) {
                     const rotationAxis = new THREE.Vector3(this.velocity.z, 0, -this.velocity.x).normalize();
                     this.mesh.rotateOnWorldAxis(rotationAxis, distanceMoved / this.radius);
                 }

                const halfWidth = ARENA_WIDTH / 2 - this.radius;
                const halfDepth = ARENA_DEPTH / 2 - this.radius;
                let bounced = false;
                if (this.mesh.position.x > halfWidth || this.mesh.position.x < -halfWidth) {
                    this.mesh.position.x = Math.max(-halfWidth, Math.min(halfWidth, this.mesh.position.x));
                    this.velocity.x *= -1;
                    bounced = true;
                }
                if (this.mesh.position.z > halfDepth || this.mesh.position.z < -halfDepth) {
                    this.mesh.position.z = Math.max(-halfDepth, Math.min(halfDepth, this.mesh.position.z));
                    this.velocity.z *= -1;
                    bounced = true;
                }
                if (bounced && this.state === 'dashing') {
                     this.state = 'wandering';
                     this.actionTimer = SPHERE_ENEMY_MIN_ACTION_INTERVAL;
                     this.setNewWanderDirection();
                }
            }
        }


        class Bullet {
            constructor(startPosition, targetPosition) {
                const direction = targetPosition.clone().sub(startPosition).normalize();
                const geometry = new THREE.CylinderGeometry(BULLET_SIZE / 2, BULLET_SIZE / 2, BULLET_SIZE * 2, 8);
                const material = new THREE.MeshBasicMaterial({ color: 0xff0000, emissive: 0xff0000 });
                this.mesh = new THREE.Mesh(geometry, material);
                
                const quaternion = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 1, 0), new THREE.Vector3(direction.x, 0, direction.z));
                this.mesh.quaternion.copy(quaternion);
                
                this.light = new THREE.PointLight(0xff0000, 1, 5);
                this.mesh.add(this.light);
                this.mesh.position.set(startPosition.x, PLAYER_SIZE / 2, startPosition.z);
                scene.add(this.mesh);

                this.velocity = new THREE.Vector3(direction.x * BULLET_SPEED, 0, direction.z * BULLET_SPEED);
            }
            destroy() {
                scene.remove(this.mesh);
            }
        }

        // --- CORE FUNCTIONS ---
        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x111111);
            camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 1, 1000);
            camera.position.set(0, 15, 15);
            camera.lookAt(0, 0, 0);
            scene.add(camera);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.getElementById('game-container').appendChild(renderer.domElement);
            scene.add(new THREE.AmbientLight(0xffffff, 0.6));
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(-5, 10, 7.5);
            directionalLight.castShadow = true;
            scene.add(directionalLight);
            createArena();
            createPlayer();
            initParticles();
            enemies.push(new ConeEnemy(new THREE.Vector3(8, PLAYER_SIZE * 1.5 / 2, -8)));
            window.addEventListener('resize', onWindowResize, false);
            document.getElementById('gameOverOverlay').addEventListener('click', restartGame);
            setupControls();
            updateUI();
            updateCameraZoom();
        }

        function createArena() {
            const halfWidth = ARENA_WIDTH / 2; const halfDepth = ARENA_DEPTH / 2;
            const points = [ new THREE.Vector3(-halfWidth, 0, -halfDepth), new THREE.Vector3(halfWidth, 0, -halfDepth), new THREE.Vector3(halfWidth, 0, halfDepth), new THREE.Vector3(-halfWidth, 0, halfDepth), new THREE.Vector3(-halfWidth, 0, -halfDepth) ];
            arenaBounds = new THREE.Line(new THREE.BufferGeometry().setFromPoints(points), new THREE.LineBasicMaterial({ color: 0xff0000 }));
            scene.add(arenaBounds);
        }
        
        function initParticles() {
            swordTrailContainer = new THREE.Group();
            scene.add(swordTrailContainer);
            const trailParticleGeo = new THREE.SphereGeometry(0.15, 8, 8);
            for (let i = 0; i < TRAIL_PARTICLE_COUNT; i++) {
                const particleMat = new THREE.MeshBasicMaterial({ color: 0x88ccff, emissive: 0x88ccff, transparent: true });
                const particleMesh = new THREE.Mesh(trailParticleGeo, particleMat);
                particleMesh.visible = false;
                swordTrailContainer.add(particleMesh);
                swordTrailParticles.push({ mesh: particleMesh, lifetime: 0 });
            }

            explosionContainer = new THREE.Group();
            scene.add(explosionContainer);
            const explosionParticleGeo = new THREE.BoxGeometry(0.2, 0.2, 0.2);
             for (let i = 0; i < EXPLOSION_PARTICLE_COUNT; i++) {
                const particleMat = new THREE.MeshStandardMaterial({ color: 0xcccccc, transparent: true });
                const particleMesh = new THREE.Mesh(explosionParticleGeo, particleMat);
                particleMesh.visible = false;
                explosionContainer.add(particleMesh);
                explosionParticles.push({ mesh: particleMesh, lifetime: 0, velocity: new THREE.Vector3() });
            }
            
            debrisContainer = new THREE.Group();
            scene.add(debrisContainer);
            const debrisGeo = new THREE.CircleGeometry(PLAYER_SIZE / 2, 16);
            for (let i = 0; i < DEBRIS_COUNT; i++) {
                const material = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.5 });
                const decal = new THREE.Mesh(debrisGeo, material);
                decal.rotation.x = -Math.PI / 2;
                decal.visible = false;
                debrisContainer.add(decal);
                debrisDecals.push({ mesh: decal, lifetime: 0 });
            }
        }

        function createPlayer() {
            const geometry = new THREE.BoxGeometry(PLAYER_SIZE, PLAYER_SIZE, PLAYER_SIZE);
            player = new THREE.Mesh(geometry, new THREE.MeshStandardMaterial({ color: 0xffffff }));
            player.position.set(0, PLAYER_SIZE / 2, 0);
            player.add(new THREE.LineSegments(new THREE.EdgesGeometry(geometry), new THREE.LineBasicMaterial({ color: 0x000000 })));
            
            swordPivot = new THREE.Object3D();
            player.add(swordPivot);

            const swordGeometry = new THREE.BoxGeometry(0.1, 0.1, SWORD_LENGTH);
            const swordMaterial = new THREE.MeshBasicMaterial({ color: 0x00aaff, emissive: 0x00aaff });
            sword = new THREE.Mesh(swordGeometry, swordMaterial);
            sword.position.z = SWORD_LENGTH / 2;
            swordPivot.add(sword);
            sword.visible = false;
            
            swordTip = new THREE.Object3D();
            swordTip.position.z = SWORD_LENGTH;
            swordPivot.add(swordTip);
            
            const ringRadius = DASH_DISTANCE + SWORD_LENGTH / 2;
            const ringGeo = new THREE.RingGeometry(ringRadius - 0.1, ringRadius + 0.1, 64);
            const ringMat = new THREE.MeshBasicMaterial({ color: 0x00aaff, side: THREE.DoubleSide, transparent: true });
            attackRangeIndicator = new THREE.Mesh(ringGeo, ringMat);
            attackRangeIndicator.rotation.x = -Math.PI / 2;
            attackRangeIndicator.visible = false;
            scene.add(attackRangeIndicator);

            scene.add(player);
        }

        function updatePlayerHealthColor() {
            if (playerInvincibilityTimer > 0) return;
            switch (playerHealth) {
                case 3: player.material.color.setHex(0xffffff); break;
                case 2: player.material.color.setHex(0xbbbbbb); break;
                case 1: player.material.color.setHex(0x888888); break;
                default: player.material.color.setHex(0x555555); break;
            }
        }

        function updateUI() {
            const healthElement = document.getElementById('healthDisplay');
            const killsElement = document.getElementById('killsDisplay');
            healthElement.innerText = 'HEALTH: ' + '❤️'.repeat(Math.max(0, playerHealth));
            killsElement.innerText = 'KILLS: ' + enemiesKilled;
        }

        function updateBullets(deltaTime) {
            for (let i = bullets.length - 1; i >= 0; i--) {
                const bullet = bullets[i];
                bullet.mesh.position.add(bullet.velocity.clone().multiplyScalar(deltaTime));
                const pos = bullet.mesh.position;
                if (pos.x > ARENA_WIDTH / 2 || pos.x < -ARENA_WIDTH / 2 || pos.z > ARENA_DEPTH / 2 || pos.z < -ARENA_DEPTH / 2) {
                    bullet.destroy(); 
                    bullets.splice(i, 1);
                    continue;
                }
                
                if (pos.distanceTo(player.position) < (PLAYER_SIZE / 2 + BULLET_SIZE / 2)) {
                    if (playerInvincibilityTimer <= 0) {
                        playerHealth--;
                        playerInvincibilityTimer = PLAYER_INVINCIBILITY_DURATION;
                        player.material.color.setHex(0x555555);
                        createPlayerHitExplosion(player.position);
                        startScreenShake();
                        updateUI();
                        if (playerHealth <= 0) {
                            gameOver();
                        }
                    }
                    bullet.destroy(); 
                    bullets.splice(i, 1);
                }
            }
        }
        
        function updateSwordTrail(deltaTime) {
            for (const particle of swordTrailParticles) {
                if (particle.lifetime > 0) {
                    particle.lifetime -= deltaTime;
                    particle.mesh.material.opacity = 0.8 * (particle.lifetime / TRAIL_PARTICLE_LIFETIME);
                    if (particle.lifetime <= 0) {
                        particle.mesh.visible = false;
                    }
                }
            }
        }

         function updateExplosionParticles(deltaTime) {
            for (const particle of explosionParticles) {
                if (particle.lifetime > 0) {
                    particle.lifetime -= deltaTime;
                    particle.velocity.y -= 20 * deltaTime; // Gravity
                    particle.mesh.position.add(particle.velocity.clone().multiplyScalar(deltaTime));
                    particle.mesh.material.opacity = (particle.lifetime / EXPLOSION_PARTICLE_LIFETIME);
                    if (particle.lifetime <= 0) {
                        particle.mesh.visible = false;
                    }
                }
            }
        }

        function updateDebris(deltaTime) {
            for (const decal of debrisDecals) {
                if (decal.lifetime > 0) {
                    decal.lifetime -= deltaTime;
                    decal.mesh.material.opacity = 0.5 * (decal.lifetime / DEBRIS_LIFETIME);
                     if (decal.lifetime <= 0) {
                        decal.mesh.visible = false;
                    }
                }
            }
        }
        
        function spawnEnemies(count) {
             if (enemies.length + count > MAX_ENEMIES) {
                count = MAX_ENEMIES - enemies.length;
            }
            if (count <= 0) return;

            const corners = [
                { x: ARENA_WIDTH / 2 - 1, z: ARENA_DEPTH / 2 - 1},
                { x: -ARENA_WIDTH / 2 + 1, z: ARENA_DEPTH / 2 - 1},
                { x: -ARENA_WIDTH / 2 + 1, z: -ARENA_DEPTH / 2 + 1},
                { x: ARENA_WIDTH / 2 - 1, z: -ARENA_DEPTH / 2 + 1},
            ];

            const playerPos = player.position;
            corners.sort((a, b) => {
                const distA = (a.x - playerPos.x)**2 + (a.z - playerPos.z)**2;
                const distB = (b.x - playerPos.x)**2 + (b.z - playerPos.z)**2;
                return distB - distA; // Sort descending
            });

            const spawnPoints = corners.slice(0, 2); 

            for (let i = 0; i < count; i++) {
                const spawnPoint = spawnPoints[Math.floor(Math.random() * spawnPoints.length)];
                
                if (Math.random() < 0.4 && sphereEnemyCount < MAX_SPHERE_ENEMIES) { 
                    const position = new THREE.Vector3(spawnPoint.x, 0, spawnPoint.z);
                    enemies.push(new SphereEnemy(position));
                } else {
                    const position = new THREE.Vector3(spawnPoint.x, PLAYER_SIZE * 1.5 / 2, spawnPoint.z);
                    enemies.push(new ConeEnemy(position));
                }
            }
        }

        function killEnemy(enemy, index) {
            hitEnemiesInAttack.push(enemy);
            enemy.destroy();
            enemies.splice(index, 1);
            enemiesKilled++;
            startScreenShake();
            updateUI();
            const spawnCount = Math.floor(Math.random() * 2) + 1; // 1 or 2 enemies
            spawnEnemies(spawnCount);
        }

        function createPlayerHitExplosion(position) {
            for (let i = 0; i < PARTICLES_PER_EXPLOSION; i++) {
                const particle = explosionParticles[nextExplosionParticleIndex];
                particle.mesh.position.copy(position);
                particle.lifetime = EXPLOSION_PARTICLE_LIFETIME * 0.5;
                particle.mesh.visible = true;
                particle.velocity.set(
                    (Math.random() - 0.5), (Math.random() - 0.5), (Math.random() - 0.5)
                ).normalize().multiplyScalar(EXPLOSION_SPEED * 0.5);
                nextExplosionParticleIndex = (nextExplosionParticleIndex + 1) % EXPLOSION_PARTICLE_COUNT;
            }
        }

        function createEnemyExplosion(position) {
            for (let i = 0; i < PARTICLES_PER_EXPLOSION; i++) {
                const particle = explosionParticles[nextExplosionParticleIndex];
                particle.mesh.position.copy(position);
                particle.lifetime = EXPLOSION_PARTICLE_LIFETIME;
                particle.mesh.visible = true;
                particle.velocity.set(
                    (Math.random() - 0.5),
                    (Math.random() * 1.5),
                    (Math.random() - 0.5)
                ).normalize().multiplyScalar(EXPLOSION_SPEED * (0.5 + Math.random() * 0.5));

                nextExplosionParticleIndex = (nextExplosionParticleIndex + 1) % EXPLOSION_PARTICLE_COUNT;
            }
        }

        function createDebrisSplat(position) {
            const decal = debrisDecals[nextDebrisIndex];
            decal.mesh.position.set(position.x, 0.01, position.z);
            decal.mesh.rotation.z = Math.random() * Math.PI * 2;
            decal.lifetime = DEBRIS_LIFETIME;
            decal.mesh.visible = true;
            decal.mesh.material.opacity = 0.5;
            nextDebrisIndex = (nextDebrisIndex + 1) % DEBRIS_COUNT;
        }

        function gameOver() {
            if (isGameOver) return;
            isGameOver = true;
            document.getElementById('gameOverOverlay').style.display = 'flex';
        }

        function restartGame() {
            document.getElementById('gameOverOverlay').style.display = 'none';

            // Reset game state variables
            playerHealth = 3;
            enemiesKilled = 0;
            sphereEnemyCount = 0;
            playerInvincibilityTimer = 0;
            attackCooldownTimer = 0;
            screenShakeTimer = 0;
            document.getElementById('game-container').style.transform = `translate(0, 0)`;

            isHolding = false;
            isDashing = false;
            isAttacking = false;
            
            // Clear collections
            for (let i = enemies.length - 1; i >= 0; i--) {
                enemies[i].destroy();
            }
            enemies.length = 0;

            for (let i = bullets.length - 1; i >= 0; i--) {
                bullets[i].destroy();
            }
            bullets.length = 0;

            // Reset particles and decals
            [...swordTrailParticles, ...explosionParticles, ...debrisDecals].forEach(p => {
                p.mesh.visible = false;
                p.lifetime = 0;
            });

            // Reset player state
            player.position.set(0, PLAYER_SIZE / 2, 0);
            player.quaternion.set(0, 0, 0, 1);
            updatePlayerHealthColor();

            // Reset UI
            updateUI();
            document.getElementById('cooldownBar').style.width = '100%';

            // Spawn initial enemy
            enemies.push(new ConeEnemy(new THREE.Vector3(8, PLAYER_SIZE * 1.5 / 2, -8)));

            // IMPORTANT: Set isGameOver to false at the end
            isGameOver = false;
        }
        
        function pointToSegmentDistanceSq(p, a, b) {
            const l2 = (a.x - b.x)**2 + (a.z - b.z)**2;
            if (l2 === 0) return (p.x - a.x)**2 + (p.z - a.z)**2;
            let t = ((p.x - a.x) * (b.x - a.x) + (p.z - a.z) * (b.z - a.z)) / l2;
            t = Math.max(0, Math.min(1, t));
            const projectionX = a.x + t * (b.x - a.x);
            const projectionZ = a.z + t * (b.z - a.z);
            return (p.x - projectionX)**2 + (p.z - projectionZ)**2;
        }

        function startScreenShake() {
            screenShakeTimer = SCREEN_SHAKE_DURATION;
        }

        function updateCameraZoom() {
            const aspect = window.innerWidth / window.innerHeight;
            if (aspect < 1) { // Portrait
                cameraOffset.set(0, 25, 22);
            } else { // Landscape
                cameraOffset.set(0, 15, 15);
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            if (isGameOver) {
                return;
            }

            const deltaTime = clock.getDelta();
            
            if (playerInvincibilityTimer > 0) {
                playerInvincibilityTimer -= deltaTime;
                if (playerInvincibilityTimer <= 0) {
                    updatePlayerHealthColor();
                }
            }
            
            if (attackCooldownTimer > 0) {
                attackCooldownTimer -= deltaTime;
                const cooldownBar = document.getElementById('cooldownBar');
                if (cooldownBar) {
                    const cooldownProgress = Math.max(0, 1 - (attackCooldownTimer / ATTACK_COOLDOWN));
                    cooldownBar.style.width = `${cooldownProgress * 100}%`;
                }
            }
            
            if (screenShakeTimer > 0) {
                const shakeX = (Math.random() - 0.5) * 2 * SCREEN_SHAKE_INTENSITY;
                const shakeY = (Math.random() - 0.5) * 2 * SCREEN_SHAKE_INTENSITY;
                document.getElementById('game-container').style.transform = `translate(${shakeX}px, ${shakeY}px)`;
                screenShakeTimer -= deltaTime;
                if(screenShakeTimer <= 0) {
                    document.getElementById('game-container').style.transform = `translate(0, 0)`;
                }
            }
            
            if (startCoords && !isDashing && !isAttacking && !isHolding) {
                if(clock.getElapsedTime() - holdStartTime > HOLD_DURATION_MS / 1000) {
                    isHolding = true;
                    if (playerInvincibilityTimer <= 0) {
                        player.material.color.setHex(0x00aaff);
                    }
                    attackRangeIndicator.position.set(player.position.x, 0.01, player.position.z);
                    attackRangeIndicator.material.opacity = 1.0;
                    attackRangeIndicator.visible = true;
                }
            }

            updateSwordTrail(deltaTime);
            updateExplosionParticles(deltaTime);
            updateDebris(deltaTime);
            enemies.forEach(enemy => enemy.update(deltaTime, player.position));
            updateBullets(deltaTime);
            
            // --- Manual Player Movement & Collision ---
            let wallCollision = false;
            if (isDashing) {
                const moveDistance = DASH_SPEED * deltaTime;
                player.position.addScaledVector(dashDirection, moveDistance);
                const axis = new THREE.Vector3(dashDirection.z, 0, -dashDirection.x);
                player.rotateOnWorldAxis(axis, (moveDistance / PLAYER_SIZE) * 2);

                if (player.position.distanceToSquared(dashStartPosition) >= DASH_DISTANCE * DASH_DISTANCE) {
                    stopDash(true);
                }
            }

            if (isAttacking) {
                const moveDistance = ATTACK_SPEED * deltaTime;
                player.position.addScaledVector(attackDirection, moveDistance);

                if (player.position.distanceToSquared(attackStartPosition) >= ATTACK_DISTANCE * ATTACK_DISTANCE) {
                    const finalPosition = attackStartPosition.clone().addScaledVector(attackDirection, ATTACK_DISTANCE);
                    player.position.copy(finalPosition);
                }
            }

            // Arena bounds collision
            const halfWidth = ARENA_WIDTH / 2 - PLAYER_SIZE / 2;
            const halfDepth = ARENA_DEPTH / 2 - PLAYER_SIZE / 2;
            if (player.position.x > halfWidth || player.position.x < -halfWidth || player.position.z > halfDepth || player.position.z < -halfDepth) {
                player.position.x = Math.max(-halfWidth, Math.min(halfWidth, player.position.x));
                player.position.z = Math.max(-halfDepth, Math.min(halfDepth, player.position.z));
                wallCollision = true;
            }

            if(wallCollision) {
                if(isDashing) stopDash(false);
                if(isAttacking) {
                    attackStartPosition.copy(player.position); 
                }
            }

            // --- Attack Animation & Logic ---
            const playerMovementFinished = !isAttacking || player.position.distanceToSquared(attackStartPosition) >= ATTACK_DISTANCE * ATTACK_DISTANCE;
            
            if (isAttacking) {
                if (!sword.visible) {
                    const distanceSq = player.position.distanceToSquared(attackStartPosition);
                    if (distanceSq >= (ATTACK_DISTANCE * SWORD_ACTIVATION_DISTANCE_RATIO) ** 2) {
                        sword.visible = true;
                        swordRotationTimer = 0;
                    }
                }
                
                if (sword.visible) {
                    swordRotationTimer += deltaTime;
                    const progress = Math.min(swordRotationTimer / SWORD_ARC_DURATION, 1);
                    const startAngle = (-2 * Math.PI) / 3; 
                    const endAngle = Math.PI / 2; 
                    swordPivot.rotation.y = startAngle + (endAngle - startAngle) * progress;

                    const tipPosition = new THREE.Vector3();
                    swordTip.getWorldPosition(tipPosition);
                    
                    for (let i = enemies.length - 1; i >= 0; i--) {
                        const enemy = enemies[i];
                        if (hitEnemiesInAttack.includes(enemy)) continue;
                        if (enemy.mesh.position.distanceTo(tipPosition) <= PLAYER_SIZE) {
                            killEnemy(enemy, i);
                        }
                    }

                    const particle = swordTrailParticles[nextTrailParticleIndex];
                    particle.mesh.position.copy(tipPosition);
                    particle.lifetime = TRAIL_PARTICLE_LIFETIME;
                    particle.mesh.visible = true;
                    nextTrailParticleIndex = (nextTrailParticleIndex + 1) % TRAIL_PARTICLE_COUNT;

                    if (progress >= 1) {
                        stopAttack();
                    }
                } else if (playerMovementFinished || wallCollision) {
                    stopAttack();
                }
            }

            camera.position.copy(player.position).add(cameraOffset);
            camera.lookAt(player.position);
            renderer.render(scene, camera);
        }

        // --- CONTROLS & MOVEMENT ---
        function setupControls() {
            renderer.domElement.addEventListener('touchstart', (e) => onSwipeStart(e.touches[0]), { passive: true });
            renderer.domElement.addEventListener('touchend', onSwipeEnd);
            renderer.domElement.addEventListener('mousedown', onSwipeStart);
            renderer.domElement.addEventListener('mouseup', onSwipeEnd);
        }

        function onSwipeStart(e) {
            if (isGameOver || isDashing || isAttacking) return;
            startCoords = { x: e.clientX, y: e.clientY };
            holdStartTime = clock.getElapsedTime();
        }

        function onSwipeEnd(e) {
            if (!startCoords || isGameOver) return;
            
            if(isHolding) {
                isHolding = false;
                attackRangeIndicator.visible = false;
                updatePlayerHealthColor();
            }

            const holdDuration = clock.getElapsedTime() - holdStartTime;
            
            const endCoords = e.changedTouches ? e.changedTouches[0] : e;
            const deltaX = endCoords.clientX - startCoords.x;
            const deltaY = endCoords.clientY - startCoords.y;

            startCoords = null; // Reset startCoords here

            if (Math.abs(deltaX) < 10 && Math.abs(deltaY) < 10) { return; }

            const viewDir = new THREE.Vector3(); camera.getWorldDirection(viewDir); viewDir.y = 0; viewDir.normalize();
            const rightDir = new THREE.Vector3(); rightDir.crossVectors(camera.up, viewDir).normalize();
            const moveDir = rightDir.multiplyScalar(-deltaX).add(viewDir.multiplyScalar(-deltaY));
            moveDir.normalize();

            if (holdDuration > HOLD_DURATION_MS / 1000) {
                startPlayerAttack(moveDir);
            } else {
                movePlayer(moveDir);
            }
        }

        function movePlayer(direction) {
            if (isDashing || isAttacking) return;
            isDashing = true;
            dashStartPosition.copy(player.position);
            dashDirection.copy(direction);
        }
        
        function startPlayerAttack(direction) {
            if (isDashing || isAttacking || attackCooldownTimer > 0) return;
            
            attackCooldownTimer = ATTACK_COOLDOWN;
            isAttacking = true;
            hitEnemiesInAttack = [];
            attackStartPosition.copy(player.position);
            attackDirection.copy(direction);
            
            const angle = Math.atan2(direction.x, direction.z);
            player.quaternion.setFromAxisAngle(new THREE.Vector3(0, 1, 0), angle);
            
            const attackEndPoint = new THREE.Vector3().copy(attackStartPosition).addScaledVector(attackDirection, ATTACK_DISTANCE);
            const attackPathHitRadiusSq = (PLAYER_SIZE * 1.5)**2;

            for (let i = enemies.length - 1; i >= 0; i--) {
                const enemy = enemies[i];
                if (hitEnemiesInAttack.includes(enemy)) continue;
                const enemyPos = enemy.mesh.position;
                
                const distSq = pointToSegmentDistanceSq(
                    { x: enemyPos.x, z: enemyPos.z },
                    { x: attackStartPosition.x, z: attackStartPosition.z },
                    { x: attackEndPoint.x, z: attackEndPoint.z }
                );

                if (distSq <= attackPathHitRadiusSq) {
                    killEnemy(enemy, i);
                }
            }
        }

        function stopDash(isDistanceStop = false) {
            if (!isDashing) return;
            isDashing = false;
            
            if(isDistanceStop) {
                const finalPosition = dashStartPosition.clone().addScaledVector(dashDirection, DASH_DISTANCE);
                player.position.copy(finalPosition);
            }

            const euler = new THREE.Euler().setFromQuaternion(player.quaternion, 'XYZ');
            euler.x = Math.round(euler.x / (Math.PI / 2)) * (Math.PI / 2);
            euler.z = Math.round(euler.z / (Math.PI / 2)) * (Math.PI / 2);
            player.quaternion.setFromEuler(euler);
        }
        
        function stopAttack() {
            if (!isAttacking) return;
            isAttacking = false;
            sword.visible = false;
            swordPivot.rotation.y = 0;
        }


        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            updateCameraZoom();
        }

        init();
        animate();
    </script>
</body>
